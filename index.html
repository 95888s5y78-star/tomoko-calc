<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>トモコデンタク</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="トモコデンタク">

    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">

    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: #ffeaa7;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        .calculator-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: transparent;
            /* 下部に十分なゆとりを持たせてバッジとの被りを確実に防ぐ */
            padding: max(16px, env(safe-area-inset-top)) 10px max(44px, env(safe-area-inset-bottom)) 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* 履歴エリアをさらにしっかり狭くして全体のバランスを取る */
        #history-display {
            background: rgba(255, 255, 255, 0.85);
            flex-grow: 1;
            min-height: 20px;
            max-height: 120px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            padding: 4px 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 2px;
            font-size: 13px;
            color: #7e57c2;
        }
        .history-row {
            display: flex;
            justify-content: space-between;
            line-height: 1.1;
        }
        .history-row.result {
            color: #5c6bc0;
            font-weight: bold;
            border-top: 1px dashed #d1c4e9;
            margin-top: 2px;
            padding-top: 2px;
        }

        #welcome-text {
            color: #a89470;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            margin: auto;
        }

        #main-display {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            padding: 6px 10px;
            text-align: right;
            font-size: 26px;
            color: #4a148c;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-height: 28px;
            flex-shrink: 0;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            touch-action: manipulation;
            flex-shrink: 0;
        }

        .calc-btn {
            border: none;
            border-radius: 12px;
            padding: 10px 0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.85);
            color: #00796b;
        }

        .calc-btn:active {
            transform: scale(0.97);
            opacity: 0.8;
        }

        .calc-btn.function {
            color: #00796b;
            background-color: rgba(178, 223, 219, 0.9);
        }

        .calc-btn.operator {
            color: #512da8;
            background-color: rgba(209, 196, 233, 0.9);
        }

        .calc-btn.equals {
            color: #ffffff;
            background-color: #7e57c2;
        }
        
        .btn-0 {
            grid-column: span 2;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <div id="history-display">
        <div id="welcome-text">トモコデンタク</div>
    </div>

    <div id="main-display">0</div>

    <div class="button-grid">
        <button class="calc-btn function" onclick="handleClear()">C</button>
        <button class="calc-btn function" onclick="handleAllClear()">AC</button>
        <button class="calc-btn function" onclick="handlePlusMinus()">±</button>
        <button class="calc-btn operator" onclick="handleOperator('/')">÷</button>
        
        <button class="calc-btn" onclick="handleNumber('7')">7</button>
        <button class="calc-btn" onclick="handleNumber('8')">8</button>
        <button class="calc-btn" onclick="handleNumber('9')">9</button>
        <button class="calc-btn operator" onclick="handleOperator('*')">×</button>
        
        <button class="calc-btn" onclick="handleNumber('4')">4</button>
        <button class="calc-btn" onclick="handleNumber('5')">5</button>
        <button class="calc-btn" onclick="handleNumber('6')">6</button>
        <button class="calc-btn operator" onclick="handleOperator('-')">-</button>
        
        <button class="calc-btn" onclick="handleNumber('1')">1</button>
        <button class="calc-btn" onclick="handleNumber('2')">2</button>
        <button class="calc-btn" onclick="handleNumber('3')">3</button>
        <button class="calc-btn operator" onclick="handleOperator('+')">+</button>
        
        <button class="calc-btn btn-0" onclick="handleNumber('0')">0</button>
        <button class="calc-btn" onclick="handleNumber('.')">.</button>
        <button class="calc-btn equals" onclick="handleEquals()">=</button>
    </div>
</div>

<script>
    let currentInput = '0';
    let previousInput = null;
    let operator = null;
    let isNewCalculation = true;

    const mainDisplay = document.getElementById('main-display');
    const historyDisplay = document.getElementById('history-display');
    const welcomeText = document.getElementById('welcome-text');

    function updateDisplay() {
        mainDisplay.textContent = currentInput;
    }

    function addHistory(text, isResult = false) {
        if (welcomeText) {
            welcomeText.remove();
        }
        const row = document.createElement('div');
        row.className = isResult ? 'history-row result' : 'history-row';
        row.innerHTML = text;
        historyDisplay.appendChild(row);
        historyDisplay.scrollTop = historyDisplay.scrollHeight;
    }

    function handleNumber(num) {
        if (isNewCalculation) {
            currentInput = num;
            isNewCalculation = false;
        } else {
            if (currentInput === '0' && num !== '.') {
                // 何もしない
            } else {
                currentInput = (currentInput === '0' && num !== '.') ? num : currentInput + num;
            }
        }
        updateDisplay();
    }

    function handleOperator(op) {
        if (operator !== null) {
            handleEquals();
        }
        previousInput = currentInput;
        operator = op;
        isNewCalculation = true;
        addHistory(`<span>${op}</span><span>${previousInput}</span>`);
    }

    function handleEquals() {
        if (previousInput === null || operator === null) return;

        const prev = parseFloat(previousInput);
        const current = parseFloat(currentInput);
        let result;

        switch (operator) {
            case '+': result = prev + current; break;
            case '-': result = prev - current; break;
            case '*': result = prev * current; break;
            case '/': 
                if (current === 0) {
                    result = 'エラー';
                } else {
                    result = prev / current;
                }
                break;
            default: return;
        }

        const finalRow = document.createElement('div');
        finalRow.className = 'history-row result';
        finalRow.innerHTML = `<span>=</span><span>${result}</span>`;
        historyDisplay.appendChild(finalRow);
        historyDisplay.scrollTop = historyDisplay.scrollHeight;

        currentInput = String(result);
        previousInput = null;
        operator = null;
        isNewCalculation = true;
        updateDisplay();
    }

    function handleClear() {
        currentInput = '0';
        isNewCalculation = true;
        updateDisplay();
    }

    function handleAllClear() {
        currentInput = '0';
        previousInput = null;
        operator = null;
        isNewCalculation = true;
        historyDisplay.innerHTML = '<div id="welcome-text">トモコデンタク</div>';
        updateDisplay();
    }
    
    function handlePlusMinus() {
        if (currentInput !== '0' && currentInput !== 'エラー') {
            currentInput = String(parseFloat(currentInput) * -1);
            updateDisplay();
        }
    }
</script>

</body>
</html>
